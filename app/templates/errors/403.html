{% extends "base.html" %}
{% block title %}403 Forbidden{% endblock %}
{% block content %}
<section class="card error-card">
  <span class="badge badge-danger">HTTP 403</span>
  <h1>Access Forbidden</h1>
  <p>{{ message }}</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-1">Return Home</a>
</section>
{% endblock %}
