{% extends "base.html" %}
{% block title %}429 Too Many Requests{% endblock %}
{% block content %}
<section class="card error-card">
  <span class="badge badge-danger">HTTP 429</span>
  <h1>Too Many Login Attempts</h1>
  <p>{{ message }}</p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-outline mt-1">Back to Login</a>
</section>
{% endblock %}
